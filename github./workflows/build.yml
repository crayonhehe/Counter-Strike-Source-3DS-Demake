name: Build Dust II 2DS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user 1001
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build 3DSX and ELF
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f source/main.c
          make
          test -f dust2ds.3dsx
          test -f dust2ds.elf

      - name: Try to package installable CIA
        shell: bash
        run: |
          set -euo pipefail
          if command -v bannertool >/dev/null 2>&1 && command -v makerom >/dev/null 2>&1; then
            mkdir -p build/cia
            bannertool makebanner -i assets/banner.png -a assets/banner.wav -o build/cia/banner.bnr
            bannertool makesmdh -s "Dust II 2DS" -l "Dust II-inspired homebrew FPS" -p "Homebrew Project" -i icon.png -o build/cia/icon.icn
            makerom -f cia -o dust2ds.cia -target t -exefslogo -elf dust2ds.elf -icon build/cia/icon.icn -banner build/cia/banner.bnr -desc app:4 -major 1 -minor 0 -micro 0 -DAPP_ENCRYPTED=false
            test -s dust2ds.cia
            echo "CIA_CREATED=true" >> "$GITHUB_ENV"
          else
            echo "CIA packaging tools are not installed in this runner; the 3DSX build is still available."
            echo "CIA_CREATED=false" >> "$GITHUB_ENV"
          fi

      - name: Upload Homebrew Launcher build
        uses: actions/upload-artifact@v4
        with:
          name: dust2ds-3dsx-v2
          path: |
            dust2ds.3dsx
            dust2ds.smdh
            dust2ds.elf
          if-no-files-found: error

      - name: Upload installable CIA
        if: env.CIA_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dust2ds-cia-v2
          path: dust2ds.cia
          if-no-files-found: error
