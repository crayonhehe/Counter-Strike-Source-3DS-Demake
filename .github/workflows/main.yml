name: 3DS CIA Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-cia:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git make ca-certificates curl file p7zip-full tar xz-utils

      - name: Install bannertool
        run: |
          set -eux
          git clone --depth=1 https://github.com/Steveice10/bannertool.git /tmp/bannertool
          make -C /tmp/bannertool
          install -m 0755 /tmp/bannertool/bannertool /usr/local/bin/bannertool
          bannertool --help >/dev/null

      - name: Install makerom
        run: |
          set -eux
          dkp-pacman -S --needed --noconfirm 3ds-makerom || true
          command -v makerom || true

      - name: Build the project
        run: |
          set -eux
          if [ -f Makefile ]; then
            make -j"$(nproc)" || make
          else
            echo "No Makefile found."
            exit 1
          fi

      - name: Create CIA
        if: always()
        run: |
          set -eux

          if [ ! -f banner.png ] || [ ! -f icon.png ]; then
            echo "banner.png or icon.png missing. Cannot create CIA."
            exit 0
          fi

          mkdir -p build

          bannertool makebanner -i banner.png -o build/banner.bin
          bannertool makesmdh -s "My Game" -l "My Game" -p "My Publisher" -i icon.png -o build/icon.icn

          if command -v makerom >/dev/null 2>&1; then
            if [ -f resources/template.rsf ] && ls ./*.elf >/dev/null 2>&1; then
              makerom -f cia \
                -o build/game.cia \
                -DAPP_ENCRYPTED \
                -target t \
                -exefslogo \
                -elf ./*.elf \
                -icon build/icon.icn \
                -banner build/banner.bin \
                -rsf resources/template.rsf
            else
              echo "Required files for CIA packaging are missing."
              exit 0
            fi
          else
            echo "makerom not available."
            exit 0
          fi

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: cia-artifact
          path: |
            build/*.cia
          if-no-files-found: ignore
