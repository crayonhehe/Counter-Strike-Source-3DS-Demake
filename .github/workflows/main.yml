name: 3DS Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DEVKITPRO: /opt/devkitpro
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/portlibs/armv6k/bin:/usr/local/bin:$PATH

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devkitPro
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates build-essential p7zip-full
          wget -qO /tmp/devkitpro-pacman.deb https://github.com/devkitPro/installer/releases/download/v1.0.0/devkitpro-pacman.amd64.deb
          sudo apt-get install -y /tmp/devkitpro-pacman.deb
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --needed --noconfirm 3ds-dev

      - name: Install bannertool
        shell: bash
        run: |
          set -eux
          git clone https://github.com/Steveice10/bannertool.git /tmp/bannertool
          make -C /tmp/bannertool
          sudo install /tmp/bannertool/bannertool /usr/local/bin/bannertool
          bannertool --help >/dev/null

      - name: Install makerom
        shell: bash
        run: |
          set -eux
          if ! command -v makerom >/dev/null 2>&1; then
            sudo dkp-pacman -S --needed --noconfirm 3ds-makerom || true
          fi
          command -v makerom || true

      - name: Build 3DSX
        shell: bash
        run: |
          set -eux
          make -j"$(nproc)" || make
          find . -maxdepth 2 \( -name "*.3dsx" -o -name "*.elf" \) -print

      - name: Package CIA (only if banner/icon are present)
        if: hashFiles('banner.png') != '' && hashFiles('icon.png') != ''
        shell: bash
        run: |
          set -eux
          mkdir -p build

          bannertool makebanner -i banner.png -o build/banner.bin
          bannertool makesmdh -s "My Game" -l "My Game" -p "My Publisher" -i icon.png -o build/icon.icn

          if command -v makerom >/dev/null 2>&1; then
            if [ -f "./*.elf" ]; then
              echo "Found ELF file"
            fi

            if [ -f "resources/template.rsf" ]; then
              makerom -f cia -o build/game.cia \
                -DAPP_ENCRYPTED \
                -target t \
                -exefslogo \
                -elf ./*.elf \
                -icon build/icon.icn \
                -banner build/banner.bin \
                -rsf resources/template.rsf
            else
              echo "No resources/template.rsf found. Skipping CIA packaging."
              exit 0
            fi
          else
            echo "makerom not found. CIA packaging skipped."
            exit 0
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-build
          path: |
            ./**/*.3dsx
            build/*.cia
          if-no-files-found: ignore
