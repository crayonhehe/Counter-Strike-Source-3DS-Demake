name: 3DS CIA Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-cia:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            make \
            tar \
            xz-utils \
            file \
            p7zip-full \
            wget

      - name: Install devkitPro toolchain
        run: |
          set -eux

          wget -qO /tmp/devkitpro-pacman.deb https://github.com/devkitPro/installer/releases/download/v1.0.0/devkitpro-pacman.amd64.deb
          sudo apt-get install -y /tmp/devkitpro-pacman.deb

          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --needed --noconfirm 3ds-dev

          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/portlibs/armv6k/bin" >> "$GITHUB_PATH"

      - name: Install bannertool
        run: |
          set -eux
          git clone --depth=1 https://github.com/Steveice10/bannertool.git /tmp/bannertool
          make -C /tmp/bannertool
          sudo install -m 0755 /tmp/bannertool/bannertool /usr/local/bin/bannertool
          bannertool --help >/dev/null

      - name: Install makerom
        run: |
          set -eux
          sudo dkp-pacman -S --needed --noconfirm 3ds-makerom || true
          command -v makerom || true

      - name: Build project
        run: |
          set -eux
          if [ -f Makefile ]; then
            make -j"$(nproc)" || make
          else
            echo "No Makefile found. Update this workflow for your project."
            exit 1
          fi

      - name: Package CIA
        run: |
          set -eux

          if [ ! -f banner.png ] || [ ! -f icon.png ]; then
            echo "banner.png or icon.png missing; cannot create CIA."
            exit 0
          fi

          mkdir -p build
          bannertool makebanner -i banner.png -o build/banner.bin
          bannertool makesmdh -s "My Game" -l "My Game" -p "My Publisher" -i icon.png -o build/icon.icn

          if command -v makerom >/dev/null 2>&1; then
            if [ -f resources/template.rsf ] && ls ./*.elf >/dev/null 2>&1; then
              makerom -f cia \
                -o build/game.cia \
                -DAPP_ENCRYPTED \
                -target t \
                -exefslogo \
                -elf ./*.elf \
                -icon build/icon.icn \
                -banner build/banner.bin \
                -rsf resources/template.rsf
            else
              echo "Required files missing for](#)

