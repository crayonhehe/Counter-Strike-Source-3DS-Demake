name: 3DS Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            tar \
            xz-utils \
            p7zip-full \
            pkg-config \
            wget \
            file

      - name: Install devkitPro
        run: |
          set -eux
          wget -qO /tmp/devkitpro-pacman.deb https://github.com/devkitPro/installer/releases/download/v1.0.0/devkitpro-pacman.amd64.deb
          sudo apt-get install -y /tmp/devkitpro-pacman.deb
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --needed --noconfirm 3ds-dev
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/portlibs/armv6k/bin" >> "$GITHUB_PATH"

      - name: Install bannertool
        run: |
          set -eux
          git clone https://github.com/Steveice10/bannertool.git /tmp/bannertool
          make -C /tmp/bannertool
          sudo install /tmp/bannertool/bannertool /usr/local/bin/bannertool
          bannertool --help >/dev/null

      - name: Install makerom if available
        run: |
          set -eux
          if command -v dkp-pacman >/dev/null 2>&1; then
            sudo dkp-pacman -S --needed --noconfirm 3ds-makerom || true
          fi
          command -v makerom || true

      - name: Show repo layout
        run: |
          set -eux
          ls -la
          find . -maxdepth 2 -type f | sed 's#^\./##' | sort | head -200

      - name: Build 3DSX
        run: |
          set -eux

          if [ -f Makefile ]; then
            make -j"$(nproc)" || make
          else
            echo "No Makefile found in repo root."
            echo "If your project uses a different build system, update this step."
            exit 1
          fi

          find . -maxdepth 3 \( -iname "*.3dsx" -o -iname "*.elf" \) -print

      - name: Package CIA if possible
        if: always()
        run: |
          set -eux

          if [ ! -f banner.png ] || [ ! -f icon.png ]; then
            echo "banner.png or icon.png missing; skipping CIA packaging."
            exit 0
          fi

          mkdir -p build

          bannertool makebanner -i banner.png -o build/banner.bin
          bannertool makesmdh -s "My Game" -l "My Game" -p "My Publisher" -i icon.png -o build/icon.icn

          if command -v makerom >/dev/null 2>&1; then
            if [ -f "resources/template.rsf" ]; then
              makerom -f cia \
                -o build/game.cia \
                -DAPP_ENCRYPTED \
                -target t \
                -exefslogo \
                -elf ./*.elf \
                -icon build/icon.icn \
                -banner build/banner.bin \
                -rsf resources/template.rsf
            else
              echo "resources/template.rsf missing. CIA packaging skipped."
            fi
          else
            echo "makerom not found. CIA packaging skipped."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-artifacts
          path: |
            ./**/*.3dsx
            build/*.cia
          if-no-files-found: ignore
