name: 3DS Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install extra system tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            make \
            ca-certificates \
            curl \
            file \
            p7zip-full \
            tar \
            xz-utils
          git --version

      - name: Install bannertool
        run: |
          set -eux
          git clone --depth=1 https://github.com/Steveice10/bannertool.git /tmp/bannertool
          make -C /tmp/bannertool
          install -m 0755 /tmp/bannertool/bannertool /usr/local/bin/bannertool
          bannertool --help >/dev/null

      - name: Install makerom
        run: |
          set -eux
          dkp-pacman -S --needed --noconfirm 3ds-makerom || true
          command -v makerom || true

      - name: Show repo layout
        run: |
          set -eux
          ls -la
          find . -maxdepth 2 -type f | sed 's#^\./##' | sort | head -200

      - name: Build 3DSX
        run: |
          set -eux

          if [ -f Makefile ]; then
            make -j"$(nproc)" || make
          else
            echo "No Makefile found in repo root."
            echo "This repo likely uses a custom build system or a different file layout."
            exit 1
          fi

          find . -maxdepth 3 \( -iname "*.3dsx" -o -iname "*.elf" \) -print

      - name: Package CIA if possible
        if: always()
        run: |
          set -eux

          if [ ! -f banner.png ] || [ ! -f icon.png ]; then
            echo "banner.png or icon.png missing. Skipping CIA packaging."
            exit 0
          fi

          mkdir -p build

          bannertool makebanner -i banner.png -o build/banner.bin
          bannertool makesmdh -s "My Game" -l "My Game" -p "My Publisher" -i icon.png -o build/icon.icn

          if command -v makerom >/dev/null 2>&1 && [ -f resources/template.rsf ]; then
            makerom -f cia \
              -o build/game.cia \
              -DAPP_ENCRYPTED \
              -target t \
              -exefslogo \
              -elf ./*.elf \
              -icon build/icon.icn \
              -banner build/banner.bin \
              -rsf resources/template.rsf
          else
            echo "makerom missing or resources/template.rsf missing. CIA packaging skipped."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-artifacts
          path: |
            ./**/*.3dsx
            build/*.cia
          if-no-files-found: ignore
